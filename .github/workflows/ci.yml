name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Run benchmarks weekly on Sundays at 00:00 UTC
        - cron: '0 0 * * 0'
    workflow_dispatch: # Allow manual trigger

jobs:
    test:
        name: Test (deno ${{ matrix.deno-version }})
        runs-on: ubuntu-latest

        strategy:
            matrix:
                deno-version: [2.x, canary]

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: ${{ matrix.deno-version }}

            # These steps mirror the hooks:pre-commit task in deno.json
            # Keep in sync when modifying CI checks
            - name: Verify formatting
              run: deno task fmt --check

            - name: Run linter
              run: deno task lint

            - name: Type check
              run: deno task check

            - name: Check scaffolding and doc claims
              run: deno task meta-check

            - name: Run tests
              run: deno task test

    benchmark-quick:
        name: Quick Benchmarks
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
        # Measured at 16 minutes locally. The query benchmarks iterate their
        # results, so this is real query work rather than generator allocation,
        # and hosted runners are slower than a dev container.
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Update BENCHMARKS.md
              run: deno task bench:update

            - name: Commit and push benchmark results
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: '📊 Update BENCHMARKS.md [skip ci]'
                  file_pattern: 'BENCHMARKS.md'
                  pull_options: '--rebase --autostash'
                  push_options: '--force-with-lease'

    benchmark-stats:
        name: Statistical Analysis
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
        # Five runs of the above plus cooldowns, measured at about 80 minutes
        # locally. Well inside the six-hour job ceiling.
        timeout-minutes: 150

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Run statistical analysis
              run: deno task bench:analyze 5 docs/analyses/benchmark-statistics.md

            - name: Commit and push benchmark statistics
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: '📊 Update benchmark statistics [skip ci]'
                  file_pattern: 'docs/analyses/benchmark-statistics.md'
                  pull_options: '--rebase --autostash'
                  push_options: '--force-with-lease'

    publish-jsr:
        name: Publish to JSR
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main' &&
             startsWith(github.event.head_commit.message, 'chore: release v'))
        permissions:
            contents: read
            id-token: write
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: 2.x

            - name: Publish @jim/spandex to JSR
              run: cd packages/@jim/spandex && deno publish

            - name: Publish @jim/spandex-ascii to JSR
              run: cd packages/@jim/spandex-ascii && deno publish

            - name: Publish @jim/spandex-html to JSR
              run: cd packages/@jim/spandex-html && deno publish
