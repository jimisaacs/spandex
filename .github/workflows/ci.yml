name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        # Run benchmarks weekly on Sundays at 00:00 UTC
        - cron: '0 0 * * 0'
    workflow_dispatch: # Allow manual trigger

jobs:
    test:
        name: Test (pinned)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version-file: .deno-version

            # The sequence lives in scripts/ci-steps.sh so that `deno task ci`
            # runs exactly what CI runs. Reproduce a specific toolchain with
            # `deno task ci:matrix`.
            - name: Verify
              run: bash scripts/ci-steps.sh

    test-canary:
        name: Test (canary, non-blocking)
        runs-on: ubuntu-latest
        # Canary is a pre-release: an upstream regression can fail this with no
        # change to the repository, and the pinned job above is what gates. This
        # is an early warning, so it reports without blocking.
        continue-on-error: true

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version: canary

            - name: Verify
              run: bash scripts/ci-steps.sh

    benchmark-quick:
        name: Quick Benchmarks
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
        # Measured at 16 minutes locally. The query benchmarks iterate their
        # results, so this is real query work rather than generator allocation,
        # and hosted runners are slower than a dev container.
        timeout-minutes: 30

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version-file: .deno-version

            - name: Update BENCHMARKS.md
              run: deno task bench:update

            - name: Commit and push benchmark results
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: '📊 Update BENCHMARKS.md [skip ci]'
                  file_pattern: 'BENCHMARKS.md'
                  pull_options: '--rebase --autostash'
                  push_options: '--force-with-lease'

    benchmark-stats:
        name: Statistical Analysis
        runs-on: ubuntu-latest
        if: |
            (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'schedule' ||
            github.event_name == 'workflow_dispatch'
        permissions:
            contents: write
        # Five runs of the above plus cooldowns, measured at about 80 minutes
        # locally. Well inside the six-hour job ceiling.
        timeout-minutes: 150

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version-file: .deno-version

            - name: Run statistical analysis
              run: deno task bench:analyze 5 docs/analyses/benchmark-statistics.md

            - name: Commit and push benchmark statistics
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  commit_message: '📊 Update benchmark statistics [skip ci]'
                  file_pattern: 'docs/analyses/benchmark-statistics.md'
                  pull_options: '--rebase --autostash'
                  push_options: '--force-with-lease'

    publish-jsr:
        name: Publish to JSR
        runs-on: ubuntu-latest
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' &&
             github.ref == 'refs/heads/main' &&
             startsWith(github.event.head_commit.message, 'chore: release v'))
        permissions:
            contents: read
            id-token: write
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Setup Deno
              uses: denoland/setup-deno@v2
              with:
                  deno-version-file: .deno-version

            - name: Publish @jim/spandex to JSR
              run: cd packages/@jim/spandex && deno publish

            - name: Publish @jim/spandex-ascii to JSR
              run: cd packages/@jim/spandex-ascii && deno publish

            - name: Publish @jim/spandex-html to JSR
              run: cd packages/@jim/spandex-html && deno publish
